defaults:
  - _self_
  - train: bge_m3

experiment:
  exp_name: retrieval-${train.name}
  exp_dir: /flagos-retrieval-ckpts/${train.name}
  seed: ${train.seed}
  task:
    type: train
    backend: native
    entrypoint: flagscale/train/train_retrieval.py
  runner:
    # The native backend uses torchrun. Override this to 8 for an 8-GPU host.
    type: ssh
    hostfile: null
    nnodes: 1
    nproc_per_node: 1
    no_shared_fs: false
    rdzv_backend: static
  envs:
    # Hardware abstraction. Keep `cuda` for the current NVIDIA environment;
    # vendor environments can override with `train.hardware.device_type=flagos`.
    FLAGSCALE_DEVICE: ${oc.env:FLAGSCALE_DEVICE,${train.hardware.device_type}}
    FS_PLATFORM: ${oc.env:FS_PLATFORM,${train.hardware.device_type}}
    FLAGSCALE_DISTRIBUTED_BACKEND: ${oc.env:FLAGSCALE_DISTRIBUTED_BACKEND,${train.hardware.distributed_backend}}
    FLAGSCALE_AUTOCAST_DEVICE: ${oc.env:FLAGSCALE_AUTOCAST_DEVICE,${train.hardware.autocast_device}}
    FLAGOS_USE_FLAGGEMS: ${oc.env:FLAGOS_USE_FLAGGEMS,${train.hardware.use_flaggems}}
    TOKENIZERS_PARALLELISM: "false"
    OMP_NUM_THREADS: "1"
    CUDA_DEVICE_MAX_CONNECTIONS: "1"
    # W&B reads the API credential from its standard netrc login; no secret is
    # stored in this repository or in the generated Hydra config.
    WANDB_MODE: online
  cmds:
    # This is overridden to the Torch-FL environment by the CUDA launch script.
    before_start: >-
      source ${oc.env:FLAGSCALE_PYTHON_ENV,/flagos-search-codes/torch-fl-cuda/.venv}/bin/activate

action: run

# NativeTrainBackend expects the same lifecycle section as Megatron configs.
# The retrieval entrypoint uses only checkpoint.save and logging.log_dir, but
# keeping these fields lets FlagScale create its standard runner directories.
train:
  # How ranks are wired. `ddp` replicates the model on every rank (historical
  # behaviour); `fsdp2` shards parameters, gradients and optimizer state with
  # torch's composable FSDP, which divides the ~16-bytes-per-parameter budget by
  # the world size instead of replicating it per card.
  #
  # `megatron` hands the run to Megatron-LM-FL's pipeline schedule
  # (flagscale/train/utils/megatron_pp.py).  It is the route for chips whose
  # FSDP2 cannot hold fp32 master weights: P800 has no `expandable_segments`, so
  # the 2.31 GiB all-gather buffer for `lm_head` cannot be allocated once memory
  # fragments and the run falls back to bf16 master.  The data split, prompt
  # framing, per-epoch checkpoint layout and metrics.json are shared with the
  # other two routes.
  parallel: ${oc.env:FLAGSCALE_PARALLEL,ddp}

  # Pipeline/tensor split for `parallel=megatron`. PP must equal the card count
  # (TP=1): Qwen3-8B has 32 attention heads, so TP>1 has no validated mapping
  # for its group-interleaved QKV.
  pipeline_model_parallel_size: ${oc.env:FLAGSCALE_PP,1}
  tensor_model_parallel_size: ${oc.env:FLAGSCALE_TP,1}

  # Directory holding the converted per-stage weights (stage{K}.pt), produced by
  #   python -m flagscale.models.retrieval.qwen3_reranker_megatron convert \
  #       --model <HF checkpoint> --pp <N> --out <this dir>
  # Required when `parallel=megatron`.
  stage_dir: ${oc.env:FLAGSCALE_STAGE_DIR,null}

  # Attention kernel and non-finite-update handling for `parallel=megatron`.
  # Vendor runtimes compile per shape, so the padded width must stay constant;
  # a width that changes every step recompiles every step and looks like a hang.
  attention_backend: ${oc.env:FLAGSCALE_ATTN_BACKEND,flash}
  skip_nonfinite: ${oc.env:FLAGSCALE_SKIP_NONFINITE,false}

  # Write a checkpoint at every epoch boundary.  These runs take hours to days
  # and used to keep only the final one, so a crash (or a run that goes bad late)
  # cost everything.  `parallel=megatron` additionally keeps a separate
  # `checkpoint-best` when validation improves.
  save_every_epoch: ${oc.env:FLAGSCALE_SAVE_EVERY_EPOCH,true}

  # Dtype the optimizer operates on. `bf16` matches the historical runs, where
  # the moments are bf16 too -- with a 1e-5 learning rate that update is below
  # bf16's 2^-8 resolution and gets rounded away. `fp32` keeps the update and
  # is what GR00T/Megatron use; the forward/backward still run in
  # `model.torch_dtype` through autocast (and FSDP2's MixedPrecisionPolicy).
  master_dtype: ${oc.env:FLAGSCALE_MASTER_DTYPE,bf16}

  # Reproducibility. `seed` (defined per model under conf/train/*.yaml) seeds
  # python/numpy/torch, the device RNG, the train loader's sampler and its
  # workers; the per-rank seed is `seed + rank`. Exact replay also needs the
  # same torch version, worker count and batch size -- those are recorded in the
  # checkpoint's metrics.json under "reproducibility" and "config".
  #
  # `deterministic` additionally disables non-deterministic kernels. It stays
  # off by default because several vendor runtimes only implement the
  # non-deterministic path; turn it on for CPU/CUDA comparisons.
  deterministic: ${oc.env:FLAGSCALE_DETERMINISTIC,false}

  hardware:
    # `cuda` is the validated path on this host. `flagos` activates torch-fl's
    # PrivateUse1 device and requires a matching vendor environment.
    device_type: ${oc.env:FLAGSCALE_DEVICE,cuda}
    distributed_backend: auto
    autocast_device: auto
    use_flaggems: false
  system:
    checkpoint:
      save: ${train.output_dir}
      load: null
    logging:
      log_dir: ${experiment.exp_dir}/logs

hydra:
  run:
    dir: ${experiment.exp_dir}/hydra

name: clip-vit-large-patch14
task: clip
seed: 42
# ViT-L/14 peaks around 79GB at batch 160, so 128 stays comfortably inside an
# 80GB card while keeping the accelerator busy.
batch_size: 128
gradient_accumulation_steps: 1
epochs: 3
log_every: 10
output_dir: /flagos-search-ckpts/${train.name}

model:
  model_type: clip_vit_large
  model_path: /flagos-search-models/clip-vit-large-patch14/clip-vit-large-patch14
  max_length: 77
  torch_dtype: bf16
  freeze_backbone: false

data:
  path: /flagos-search-datasets/wds_mscoco_captions2017/wds_mscoco_captions2017/train
  validation_path: /flagos-search-datasets/wds_mscoco_captions2017/wds_mscoco_captions2017/train
  test_path: /flagos-search-datasets/wds_mscoco_captions2017/wds_mscoco_captions2017/test
  train_split: train
  validation_split: validation
  test_split: all
  eval_max_samples: 256
  split_modulo: 20
  shuffle_buffer: 2000
  max_samples: null

optimizer:
  lr: 1.0e-7
  weight_decay: 0.01
  max_grad_norm: 1.0

name: qwen3-reranker-8b
task: reranker
seed: 42
# Full-parameter fine-tuning of the 8B reranker.  AdamW state for 8B would need
# ~64GB on its own and cannot fit an 80GB card, so this config pairs a small
# micro-batch and gradient checkpointing with the Adafactor optimizer (factored
# second-moment state, built into torch).  Measured peak is ~50GB at batch 32.
# max_length 640 covers the full T2Ranking triplet distribution (p99 471,
# max 541 tokens) instead of padding to 2048.
batch_size: 32
gradient_accumulation_steps: 1
epochs: 3
log_every: 5
output_dir: /flagos-search-ckpts/${train.name}

model:
  model_type: qwen3_reranker
  model_path: /flagos-search-models/Qwen3-Reranker-8B/Qwen3-Reranker-8B
  max_length: 640
  torch_dtype: bf16
  # Fine-tune all 8B weights using the checkpoint's own yes/no scoring
  # (log P(yes) - log P(no) at the final position).  A randomly initialised
  # scalar head discards the pretrained reranking ability: with the head the
  # loss sat above the ln2 random baseline, while the native logit scoring
  # starts around 0.43 BCE (acc ~0.81) on the same pairs.
  freeze_backbone: false
  use_score_head: false
  gradient_checkpointing: true

data:
  path: /flagos-search-datasets/t2ranking/t2ranking/triplet-15
  validation_path: /flagos-search-datasets/t2ranking/t2ranking/triplet-15
  test_path: /flagos-search-datasets/t2ranking/t2ranking/triplet-15
  train_split: train
  validation_split: validation
  test_split: test
  eval_max_samples: 256
  split_modulo: 20
  shuffle_buffer: 20000
  # Group rows of similar length so batches pad less (batch-max padding drops
  # roughly in half for this long-tailed corpus).
  length_sort_window: 256
  num_negatives: 1
  max_samples: null

optimizer:
  name: adafactor
  lr: 1.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0

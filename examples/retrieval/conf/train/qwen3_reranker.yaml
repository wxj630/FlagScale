name: qwen3-reranker-8b
task: reranker
seed: 42
# Full-parameter fine-tuning of the 8B reranker.  AdamW state for 8B would need
# ~64GB on its own and cannot fit an 80GB card, so this config pairs a small
# micro-batch and gradient checkpointing with the Adafactor optimizer (factored
# second-moment state, built into torch).  Measured peak is ~50GB at batch 32.
# max_length 640 covers the full T2Ranking triplet distribution (p99 471,
# max 541 tokens) instead of padding to 2048.
batch_size: 32
gradient_accumulation_steps: 1
epochs: 3
log_every: 5
# Default location; override with train.output_dir=... to keep runs apart.
output_dir: ${oc.env:FLAGSCALE_OUTPUT_DIR,/flagos-retrieval-ckpts/${train.name}}

model:
  model_type: qwen3_reranker
  model_path: /flagos-retrieval-models/Qwen3-Reranker-8B/Qwen3-Reranker-8B
  max_length: 640
  torch_dtype: bf16
  # Fine-tune all 8B weights using the checkpoint's own yes/no scoring
  # (log P(yes) - log P(no) at the final position).  A randomly initialised
  # scalar head discards the pretrained reranking ability: with the head the
  # loss sat above the ln2 random baseline, while the native logit scoring
  # starts around 0.43 BCE (acc ~0.81) on the same pairs.
  freeze_backbone: false
  use_score_head: false
  gradient_checkpointing: true

data:
  path: /flagos-retrieval-datasets/t2ranking/t2ranking/triplet-15
  validation_path: /flagos-retrieval-datasets/t2ranking/t2ranking/triplet-15
  test_path: /flagos-retrieval-datasets/t2ranking/t2ranking/triplet-15
  train_split: train
  validation_split: validation
  test_split: test
  eval_max_samples: 256
  split_modulo: 20
  shuffle_buffer: 20000
  # Group rows of similar length so batches pad less (batch-max padding drops
  # roughly in half for this long-tailed corpus).
  length_sort_window: 256
  num_negatives: 1
  max_samples: null

optimizer:
  # AdamW, not Adafactor.  Adafactor existed to fit 8B full fine-tuning on one
  # 80GB card: its factored second moment is O(rows+cols) instead of two full
  # fp32 moments.  Two things changed that:
  #   * FSDP2 shards the optimizer state across ranks, which removes the memory
  #     pressure Adafactor was bought for;
  #   * Adafactor's update calls torch.norm(grad, dim=-2).square_() in place,
  #     and DTensor rejects that on a _NormPartial gradient under FSDP2.
  # AdamW also keeps its moments in fp32 alongside the fp32 master weights,
  # which is the point of train.master_dtype=fp32.
  name: adamw
  lr: 1.0e-5
  # The rate has to come down over the run. With a constant 1e-5 for the whole
  # 3-epoch fine-tune, the A100 run ended at train_loss 0.042 vs
  # validation_loss 0.377 (9x) and lost 1.5 R@5 points against the base model.
  # `lr_decay_steps` is optional: the datasets are streaming, so when it is
  # omitted the schedule re-anchors after epoch 1 using the measured epoch
  # length.
  lr_decay_style: cosine
  min_lr: 1.0e-6
  warmup_steps: 200
  weight_decay: 0.01
  max_grad_norm: 1.0

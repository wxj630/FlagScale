name: qwen3-vl-embedding-8b
task: vl_embedding
seed: 42
# Single-card full-parameter training of the 8B VL encoder.  AdamW state for 8B
# cannot fit an 80GB card, so this config uses gradient checkpointing, the
# Adafactor optimizer (factored second-moment state) and a small micro-batch,
# with gradient accumulation restoring an effective batch of 32.  The
# pretrained vision tower stays frozen (set freeze_vision: false to train it
# too when more memory is available); the 8B language tower and the projection
# are trained.
batch_size: 8
gradient_accumulation_steps: 4
epochs: 3
log_every: 5
temperature: 0.05
output_dir: /flagos-search-ckpts/${train.name}

model:
  model_type: qwen3_vl_embedding
  model_path: /flagos-search-models/Qwen3-VL-Embedding-8B/Qwen3-VL-Embedding-8B
  max_length: 2048
  torch_dtype: bf16
  freeze_backbone: false
  freeze_vision: true
  gradient_checkpointing: true
  projection_dim: 1024

data:
  path: /flagos-search-datasets/wds_mscoco_captions2017/wds_mscoco_captions2017/train
  validation_path: /flagos-search-datasets/wds_mscoco_captions2017/wds_mscoco_captions2017/train
  test_path: /flagos-search-datasets/wds_mscoco_captions2017/wds_mscoco_captions2017/test
  train_split: train
  validation_split: validation
  test_split: all
  eval_max_samples: 256
  split_modulo: 20
  shuffle_buffer: 2000
  num_workers: 4
  max_samples: null

optimizer:
  name: adafactor
  lr: 1.0e-5
  weight_decay: 0.01
  max_grad_norm: 1.0
